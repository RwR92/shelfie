spring.application.name=shelfie

# Connection details come from environment variables, with local dev defaults after the colon
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shelfie}
spring.datasource.username=${DB_USER:shelfie}
spring.datasource.password=${DB_PASSWORD:shelfie}

# Create or update tables from the entities, but never drop existing data
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.open-in-view=false